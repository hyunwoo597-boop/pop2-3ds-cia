name: Build Prince of Persia 2 3DS CIA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CIA
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
          make -f Makefile.ctr -j1
          test -f prince-of-persia-2.cia

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: prince-of-persia-2-3ds
          if-no-files-found: error
          path: |
            prince-of-persia-2.cia
            prince-of-persia-2.3dsx
            prince-of-persia-2.smdh
            prince-of-persia-2.bnr
            prince-of-persia-2.elf
